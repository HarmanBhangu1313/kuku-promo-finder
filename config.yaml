# ---- Swap the model here. Any OpenAI-compatible endpoint works. ----
# Check the provider's docs for the current model name before running.
llm:
  # Google Gemini (free tier), OpenAI-compatible endpoint
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  model: gemini-3.5-flash-lite
  api_key_env: GEMINI_API_KEY
  temperature: 0.3
  sleep_between_calls: 4      # stay under free-tier rate limits

mode: llm          # llm | heuristic | both
window: 2          # episodes per LLM call; 2 lets it stitch across adjacent episodes
cold_viewer: false # disabled across the board to eliminate ranking bias between checked/unchecked clips

promo:
  min_len: 20
  max_len: 60
  per_window: 5
  top_k: 10
  max_per_episode: 2

weights:           # ranking weights - balanced without tail bonus dominating
  hook: 0.40
  cliffhanger: 0.40
  standalone: 0.15
  early_episode: 0.10
  spoiler_penalty: 0.15

episode_ending:    # calibrated story rule
  tail_seconds: 25            # the "last minutes" of an episode = its final N seconds
  resolution_from_episode: 48 # episodes >= this are finale stretch: happy/resolved endings allowed
  tail_bonus: 0.15            # recalibrated from 0.4 to 0.15 so hook/cliffhanger drive ranking
